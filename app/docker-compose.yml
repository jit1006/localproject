# Local PostgreSQL 16 for development. btree_gist ships with the standard image.
# This provisions the migration OWNER role/database. Create the non-owner runtime
# role separately (see README) and apply 03_runtime_grants.sql.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: prms_owner
      POSTGRES_PASSWORD: ownerpw
      POSTGRES_DB: prms
    ports:
      - "5432:5432"
    volumes:
      - prms_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prms_owner -d prms"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  prms_pgdata:
