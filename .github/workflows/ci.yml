name: CI

on:
  push:
    branches: [main, "complete-project"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: prms_owner
          POSTGRES_PASSWORD: ownerpw
          POSTGRES_DB: prms
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U prms_owner -d prms"
          --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: app/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Apply authoritative schema + seed
        env:
          OWNER_DATABASE_URL: postgresql://prms_owner:ownerpw@localhost:5432/prms
        run: ./scripts/apply_schema.sh
      - name: Unit tests (no DB)
        run: pytest tests/test_security.py -q
      - name: Integration tests (DB)
        env:
          PRMS_TEST_DATABASE_URL: postgresql+psycopg://prms_owner:ownerpw@localhost:5432/prms
        run: pytest tests/test_lifecycle_integration.py -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run build
